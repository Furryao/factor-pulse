name: Publish Factor Pulse
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1-5' # 22:00 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish = deploy current files; refresh = fetch, verify and deploy data'
        type: choice
        options: [refresh, publish]
        default: refresh
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-cloud.txt
      - name: Install pinned calculation dependencies
        run: python -m pip install -r scripts/requirements-cloud.txt
      - name: Verify calculation and time-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Refresh complete investor observations
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh')
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          VERIFY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          if [ -z "$TUSHARE_TOKEN" ]; then
            echo '::error::Add the TUSHARE_TOKEN repository secret, then run this workflow with mode=refresh. Current public data was not changed.'
            exit 1
          fi
          if [ "$VERIFY" = 'true' ]; then
            python scripts/refresh_investor.py --verify
          else
            python scripts/refresh_investor.py
          fi
      - name: Commit validated aggregate data only
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh')
        run: |
          if ! git diff --quiet -- investor/data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- investor/data.json
            git commit -m 'Refresh validated investor observations'
            git push origin HEAD:main
          fi
      - name: Extract website
        run: unzip -q site.zip -d public-site
      - name: Include investor edition
        run: cp -R investor public-site/investor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public investor data
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          expected=Path('investor/data.json').read_bytes()
          url='https://furryao.github.io/factor-pulse/investor/data.json'
          for attempt in range(12):
              try:
                  req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                  actual=urllib.request.urlopen(req,timeout=30).read()
                  if actual==expected:
                      print('Public payload verified:',hashlib.sha256(actual).hexdigest())
                      break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Public payload does not match the validated checkout')
          PY
